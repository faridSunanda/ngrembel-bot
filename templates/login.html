<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Wisata Ngrembel Asri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🌿</div>
      <h2 style="font-size: 24px; font-weight: 800; color: #064e3b; margin-bottom: 6px;">Ngrembel Asri</h2>
      <p style="font-size: 14px; color: #64748b;">Panel Manajemen & Reservasi Wisata</p>
    </div>

    {% if error %}
    <div style="background: #fee2e2; border-left: 4px solid #ef4444; color: #b91c1c; padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px;">
      ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Username Admin</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username" required autofocus value="admin">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" required value="admin123">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
        Masuk ke Dashboard ➔
      </button>

      <div style="margin-top: 24px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 16px;">
        Kredensial Default: <b>admin</b> / <b>admin123</b>
      </div>
    </form>
  </div>
</body>
</html>
